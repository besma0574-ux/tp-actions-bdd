
name: Python CI

on:
  push:
  pull_request:

jobs:
  # JOB 1 : PYTHON
  python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Configurer la base de donnees
        run: bash db/setup.sh

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dependances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Executer les tests
        run: pytest -v
        working-directory: python-app

  # JOB 2 : NODE.JS
  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer la base de donnees
        run: bash db/setup.sh

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm ci
        working-directory: node-app

      - name: Executer les tests
        run: npm test
        working-directory: node-app

  # JOB 3 : JAVA
  java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer la base de donnees
        run: bash db/setup.sh

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Construire le projet Java
        run: mvn -B package
        working-directory: java-app

  # JOB 4 : PHP
  php:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer la base de donnees
        run: bash db/setup.sh

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo,pdo_pgsql

      - name: Installer les dependances
        run: composer install --no-interaction
        working-directory: php-app

      - name: Executer les tests
        run: vendor/bin/phpunit tests
        working-directory: php-app

  # JOB 5 : BUILD FINAL
  build:
    runs-on: ubuntu-latest
    needs: [python, node, java, php]

    steps:
      - name: Build du projet
        run: echo "Build réussi ! Tous les tests sont validés."
